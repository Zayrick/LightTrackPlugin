name: Build packages

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or ref to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: LightTrackPlugin-${{ matrix.system }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TYPE: Release
      # Must match the Qt that OpenRGB ships (OpenRGB 1.0 for Windows: 6.8.3).
      QT_VERSION: '6.8.3'
      ASSET_NAME: LightTrackPlugin-${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            arch: x64
            os: windows
            runner: windows-2022
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
          - system: Linux
            arch: x64
            os: linux
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: true

      # Only the Effects plugin dependencies that are compiled in; its own
      # nested OpenRGB checkout is not needed (deps/OpenRGB is used).
      - name: Fetch nested submodules
        shell: bash
        run: >
          git -C deps/OpenRGBEffectsPlugin submodule update --init
          Dependencies/QCodeEditor Dependencies/SimplexNoise

      - name: Install Qt
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Build Windows package
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake -S . -B build -A "${{ matrix.cmake_arch }}" "-DCMAKE_CONFIGURATION_TYPES=$env:BUILD_TYPE" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          & cmake --build build --config "$env:BUILD_TYPE" --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & ctest --test-dir build -C "$env:BUILD_TYPE" --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

          New-Item -ItemType Directory -Force -Path package, dist | Out-Null
          $plugin = Get-ChildItem build -Recurse -Filter LightTrackPlugin.dll |
            Where-Object { $_.FullName -match "\\$env:BUILD_TYPE\\" } |
            Select-Object -First 1
          if (-not $plugin) { throw 'LightTrackPlugin.dll not found' }

          Copy-Item -LiteralPath $plugin.FullName -Destination package
          Copy-Item -LiteralPath LICENSE, README.md -Destination package
          Compress-Archive -Path 'package\*' -DestinationPath "dist\$env:ASSET_NAME.zip" -Force

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libqt6core5compat6-dev libqt6opengl6-dev \
            libgl-dev libvulkan-dev libxkbcommon-dev \
            libopenal-dev libpipewire-0.3-dev

      - name: Build Linux package
        if: matrix.os == 'linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

          mkdir -p package dist
          plugin="$(find build -name libLightTrackPlugin.so -type f | head -n 1)"
          test -n "$plugin"
          cp "$plugin" package/
          cp LICENSE README.md package/
          tar -C package -czf "dist/$ASSET_NAME.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}.*
          if-no-files-found: error
